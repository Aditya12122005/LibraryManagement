name: Python CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script
        run: python fine_calculator.py

      - name: Run unit tests
        run: pytest test_fine.py -v

      - name: Display workflow status
        if: always()
        run: echo "Workflow status - ${{ job.status }}"
